# The model IDs in packages/ai/src/models.js must exist on OpenRouter. This
# checks them against the live catalogue (a public endpoint, no key needed)
# weekly and on every push that touches the AI layer, so a retired model
# shows up here rather than as a failed agent run.
name: models
on:
  push:
    paths: ['packages/ai/**', 'tools/verify-models.mjs', '.github/workflows/models.yml']
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # GEMINI_API_KEY is optional here: add it as an Actions secret to have
      # the Gemini ids checked too; without it they are reported unchecked.
      - name: Every configured model exists
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run models:verify
