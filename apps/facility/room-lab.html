<!doctype html>
<!--
  The room lab: one room, big, with nothing else on the screen.

  Prop work is impossible to judge on the floor at fit zoom, so this page
  bakes the facility exactly as the floor does and crops a single room out
  of the buffer at whatever scale you ask for. It is a development page —
  Vite only builds index.html, so it never ships.

      npm run dev:local     then     /room-lab.html?r=garage,vault&s=6
-->
<meta charset="utf-8"><title>room lab</title>
<body style="margin:0;background:#05050a;font:12px ui-monospace,Menlo,monospace;color:#8a889e">
<div id="out"></div>
<script type="module">
import { PLAN_BY_ID, ROOM_W, ROOM_H } from './src/config/floorplan.js';
import { createBuffer, bakeStatic, drawLive } from './src/render/factory.js';
const q = new URLSearchParams(location.search);
const ids = (q.get('r') || Object.keys(PLAN_BY_ID).join(',')).split(',');
const S = Number(q.get('s') || 4), T = Number(q.get('t') || 3.2);
const staticBuf = createBuffer(), buf = createBuffer();
bakeStatic(staticBuf, {});
drawLive(buf, staticBuf, { agents: [] }, new Map(), T);
for (const id of ids) {
  const p = PLAN_BY_ID[id]; if (!p) continue;
  const label = document.createElement('div'); label.textContent = id; label.style.margin = '8px';
  const c = document.createElement('canvas');
  c.width = (ROOM_W + 8) * S; c.height = (ROOM_H + 8) * S; c.style.display = 'block'; c.style.margin = '0 8px 12px';
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  g.drawImage(buf, p.rect[0] - 4, p.rect[1] - 4, ROOM_W + 8, ROOM_H + 8, 0, 0, c.width, c.height);
  document.getElementById('out').append(label, c);
}
window.__ready = true;
</script>
