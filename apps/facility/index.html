<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#06080b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ARCANE">
  <title>THE ARCANE</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/src/ui.css">
</head>
<body>
  <header id="bar">
    <a class="brand" href="#" aria-label="The Arcane, the floor">
      <svg class="sigil" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="1"/><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-opacity=".7" stroke-width="1" stroke-dasharray="2 2.4"/><path d="M12 6.2 17.8 12 12 17.8 6.2 12Z" fill="none" stroke="currentColor" stroke-width="1.2"/><circle class="sigil-core" cx="12" cy="12" r="1.9"/></svg>
      <span class="name">ARCANE</span><span class="v">LEOOS<b>v3</b></span>
    </a>
    <div class="status" id="bar-status"></div>
    <nav id="views" aria-label="Modules">
      <button data-view="floor" class="on"><i class="lamp"></i><span class="code">00</span>FLOOR</button>
      <button data-view="bridge"><i class="lamp"></i><span class="code">C2</span>BRIDGE</button>
      <button data-view="library"><i class="lamp"></i><span class="code">C3</span>LIBRARY</button>
      <button data-view="beacon"><i class="lamp"></i><span class="code">C1</span>BEACON</button>
      <button data-view="missions"><i class="lamp"></i><span class="code">OPS</span>MISSIONS</button>
      <button data-view="graph"><i class="lamp"></i><span class="code">MEM</span>GRAPH</button>
    </nav>
    <button id="go" class="go" title="Go to any room (Cmd-K)" aria-label="Go to any room"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="m10.4 10.4 3.4 3.4" stroke="currentColor" stroke-width="1.3"/></svg><span class="go-label">Go to a room, an agent…</span><kbd>⌘K</kbd></button>
    <div class="bell" id="bell"></div>
    <div class="auth" id="auth"></div>
    <div class="zoom" id="hud">
      <button data-zoom="fit">FIT</button>
      <button data-zoom="2">2×</button>
      <button data-zoom="3">3×</button>
    </div>
  </header>
  <main id="stage">
    <canvas id="world"></canvas>
    <div id="world-hud" aria-hidden="true"></div>
    <canvas id="floor"></canvas>
    <div id="floor-hud"></div>
    <div id="tip"></div>
    <div id="strip"></div>
    <div id="zoomer" class="zoomer"><button data-zoom="out" aria-label="Zoom out">−</button><button data-zoom="fit" aria-label="Fit the floor">⊡</button><button data-zoom="in" aria-label="Zoom in">+</button></div>
  </main>
  <div id="chassis" aria-hidden="true"></div>
  <section id="dash" class="view hidden"></section>
  <section id="bridge" class="view hidden"></section>
  <section id="warroom" class="view hidden"></section>
  <section id="lab" class="view hidden"></section>
  <section id="vault" class="view hidden"></section>
  <section id="sanctum" class="view hidden"></section>
  <section id="records" class="view hidden"></section>
  <section id="control" class="view hidden"></section>
  <section id="missions" class="view hidden"></section>
  <section id="intel" class="view hidden"></section>
  <section id="library" class="view hidden"></section>
  <section id="beacon" class="view hidden"></section>
  <section id="journal" class="view hidden"></section>
  <section id="graph" class="view hidden"><canvas id="graph-canvas"></canvas><div class="legend" id="graph-legend"></div></section>
  <nav id="tabs" aria-label="Rooms">
    <button data-tab="floor">FLOOR</button>
    <button data-tab="bridge">BRIDGE</button>
    <button data-tab="beacon">BEACON</button>
    <button data-tab="library">LIBRARY</button>
    <button data-tab="more">MORE</button>
  </nav>
  <div id="nav" class="hidden" aria-hidden="true"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
