<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0a0a12">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ARCANE">
  <title>THE ARCANE</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/src/ui.css">
</head>
<body>
  <header id="bar">
    <a class="brand" href="#" aria-label="The Arcane, the floor">
      <svg class="sigil" viewBox="0 0 12 12" width="18" height="18" shape-rendering="crispEdges" aria-hidden="true"><path d="M5 0h2v1h-2zM3 1h2v1h-2zM7 1h2v1h-2zM1 3h1v2h-1zM10 3h1v2h-1zM0 5h1v2h-1zM11 5h1v2h-1zM1 7h1v2h-1zM10 7h1v2h-1zM3 10h2v1h-2zM7 10h2v1h-2zM5 11h2v1h-2z" fill="#a98bff"/><path d="M4 4h4v4h-4z" fill="#8b5cf6"/><path d="M5 5h2v2h-2z" fill="#efe9ff"/></svg>
      <span class="name">THE ARCANE</span><span class="v">LEOOS v3</span>
    </a>
    <div class="status" id="bar-status"></div>
    <nav id="views">
      <button data-view="floor" class="on">FLOOR</button>
      <button data-view="bridge">BRIDGE</button>
      <button data-view="library">LIBRARY</button>
      <button data-view="beacon">BEACON</button>
      <button data-view="graph">BRAIN · GRAPH</button>
    </nav>
    <button id="go" class="go" title="Go to any room (Cmd-K)" aria-label="Go to any room"><span class="gt">&gt;</span><span class="go-label">Go to…</span><kbd>⌘K</kbd></button>
    <div class="bell" id="bell"></div>
    <div class="auth" id="auth"></div>
    <div class="zoom" id="hud">
      <button data-zoom="fit">FIT</button>
      <button data-zoom="2">2x</button>
      <button data-zoom="3">3x</button>
    </div>
  </header>
  <main id="stage">
    <canvas id="floor"></canvas>
    <div id="tip"></div>
    <div id="strip"></div>
    <div id="zoomer" class="zoomer"><button data-zoom="out" aria-label="Zoom out">−</button><button data-zoom="fit" aria-label="Fit the floor">⊡</button><button data-zoom="in" aria-label="Zoom in">+</button></div>
  </main>
  <section id="dash" class="view hidden"></section>
  <section id="bridge" class="view hidden"></section>
  <section id="warroom" class="view hidden"></section>
  <section id="lab" class="view hidden"></section>
  <section id="vault" class="view hidden"></section>
  <section id="sanctum" class="view hidden"></section>
  <section id="records" class="view hidden"></section>
  <section id="control" class="view hidden"></section>
  <section id="intel" class="view hidden"></section>
  <section id="library" class="view hidden"></section>
  <section id="beacon" class="view hidden"></section>
  <section id="journal" class="view hidden"></section>
  <section id="graph" class="view hidden"><canvas id="graph-canvas"></canvas><div class="legend" id="graph-legend"></div></section>
  <nav id="tabs" aria-label="Rooms">
    <button data-tab="floor">FLOOR</button>
    <button data-tab="bridge">BRIDGE</button>
    <button data-tab="beacon">BEACON</button>
    <button data-tab="library">LIBRARY</button>
    <button data-tab="more">MORE</button>
  </nav>
  <div id="nav" class="hidden" aria-hidden="true"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
