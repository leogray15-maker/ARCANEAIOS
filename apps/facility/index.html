<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>THE ARCANE</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/src/ui.css">
</head>
<body>
  <header id="bar">
    <div class="brand">THE ARCANE <span class="v">LEOOS v3</span></div>
    <div class="status" id="bar-status"></div>
    <nav id="views">
      <button data-view="floor" class="on">FLOOR</button>
      <button data-view="bridge">BRIDGE</button>
      <button data-view="library">LIBRARY</button>
      <button data-view="beacon">BEACON</button>
      <button data-view="graph">BRAIN GRAPH</button>
    </nav>
    <div class="auth" id="auth"></div>
    <div class="zoom" id="hud">
      <button data-zoom="fit">FIT</button>
      <button data-zoom="2">2x</button>
      <button data-zoom="3">3x</button>
    </div>
  </header>
  <main id="stage">
    <canvas id="floor"></canvas>
    <div id="tip"></div>
    <div id="strip"></div>
  </main>
  <section id="dash" class="view hidden"></section>
  <section id="bridge" class="view hidden"></section>
  <section id="warroom" class="view hidden"></section>
  <section id="lab" class="view hidden"></section>
  <section id="vault" class="view hidden"></section>
  <section id="sanctum" class="view hidden"></section>
  <section id="records" class="view hidden"></section>
  <section id="control" class="view hidden"></section>
  <section id="library" class="view hidden"></section>
  <section id="beacon" class="view hidden"></section>
  <section id="journal" class="view hidden"></section>
  <section id="graph" class="view hidden"><canvas id="graph-canvas"></canvas><div class="legend" id="graph-legend"></div></section>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
